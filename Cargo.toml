[package]
name = "algox"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Comprehensive, high-performance suite of 31 algorithm families in pure Rust (trees, graphs, sharding, ML, geometry, crypto, compression, filtering, sorting, and more)."
repository = "https://github.com/shregar1/algox"
readme = "README.md"
keywords = ["algorithm", "data-structures", "sharding", "graph", "compression"]
categories = ["algorithms", "data-structures"]

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32", "xxh64"] }
argon2 = "0.5"
bcrypt = "0.15"
scrypt = "0.11"
pbkdf2 = "0.12"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
flate2 = "1"
brotli = "6"
lz4_flex = "0.11"
zstd = "0.13"
base64ct = "1"
hex = "0.4"
percent-encoding = "2"
rand = "0.8"
geohash = "0.13"
petgraph = "0.6"
pathfinding = "4"
kiddo = "4"
quadtree_rs = "0.1"
fastbloom = "0.12"
governor = "0.6"
maglev = "0.2"
hashring = "0.3"
moka = { version = "0.12", features = ["sync"] }
lru = "0.12"
strsim = "0.11"
aho-corasick = "1"
nalgebra = "0.33"
primal = "0.3"
ringbuf = "0.4"
disjoint-sets = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
