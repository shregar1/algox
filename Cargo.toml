[package]
name = "algox"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Comprehensive, high-performance suite of 24 algorithm families in pure Rust (data structures, graphs, DP, trees, crypto, compression, filtering, sorting, and more)."
repository = "https://github.com/shregar1/algox"
readme = "README.md"
keywords = ["algorithm", "data-structures", "graph", "compression", "crypto"]
categories = ["algorithms", "data-structures"]

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
argon2 = { version = "0.5", features = ["password-hash"] }
bcrypt = "0.16"
scrypt = "0.11"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
brotli = "7"
zstd = "0.13"
lz4_flex = "0.11"
base64ct = "1"
hex = "0.4"
percent-encoding = "2"

aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rsa = { version = "0.9", features = ["sha2"] }
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
rota-lb = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
